<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tobias Golling — Curriculum Vitae | RODEM, University of Geneva</title>
<meta name="description" content="Curriculum vitae of Tobias Golling, Professor of Physics at the University of Geneva.">
<link rel="canonical" href="https://dpnc.unige.ch/golling/cv.html">
<link rel="icon" href="images/logo/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css?v=133">
<!-- Apply the saved light/dark choice before the page paints, so a visitor
     who picked dark never sees a white flash. The button that writes this
     choice lives in the header; the rest of the behaviour is in render.js. -->
<script>
  try {
    var t = localStorage.getItem("rodem-theme");
    if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<!-- ===================== HEADER (same on every page) ======================
     The menu itself is built from NAV in assets/js/content.js, so adding a
     tab is a one-line edit there — not an edit to every page.
     ==================================================================== -->
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="images/logo/rodem-mark-small.svg" alt="" aria-hidden="true">
      <span class="brand-text">
        <span data-site-name>RODEM</span>
        <span class="brand-sub" data-site-sub>Golling Group</span>
      </span>
    </a>
    <button id="theme-toggle" type="button" aria-pressed="false" title="Switch to dark mode">
      <span class="theme-icon-light" aria-hidden="true">&#9789;</span><span class="theme-icon-dark" aria-hidden="true">&#9788;</span>
      <span class="sr-only">Switch colour theme</span>
    </button>
    <button id="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="site-nav" id="site-nav" aria-label="Main"></nav>
  </div>
</header>

<main id="main">

  <!-- This page is deliberately NOT in the main navigation: it is reached from
       the PI's profile card in the team section of the home page. -->
  <section class="hero" style="padding-bottom:1rem">
    <div class="wrap">
      <p class="eyebrow">Curriculum Vitae</p>
      <h1 id="cv-name">Tobias Golling</h1>
      <p class="lede" id="cv-role"></p>
      <p><a href="index.html#team">&larr; Back to the team</a></p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div id="cv-root"></div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap">
    <!-- Static links to every page. The header menu is built by JavaScript
         from NAV in content.js, so anything that does not run scripts — some
         search-engine crawlers, link previews — would otherwise see no route
         from one page to the next. These plain hrefs are that route.
         Keep them in step with NAV. -->
    <nav class="footer-sitemap" aria-label="All pages">
      <a href="index.html">Home</a>
      <a href="vision.html">Vision</a>
      <a href="research.html">Research</a>

      <a href="join.html">Join us</a>
      <a href="outreach.html">Outreach</a>
    </nav>
    <p>&copy; <span id="footer-year"></span> <span data-site-name></span>, University of Geneva</p>
    <div class="footer-links" id="footer-links"></div>
  </div>
</footer>

<script src="assets/js/content.js?v=133"></script>
<script src="assets/js/render.js?v=133"></script>
</body>
</html>
